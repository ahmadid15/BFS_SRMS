<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login SRMS</title>

        <link 
            rel="stylesheet" 
            href="{{ url_for('static', filename='css/bootstrap.min.css') }}"
        >
    </head>
    <body class="bg-light d-flex align-items-center" style="height: 100vh;">

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-4">

                    <div class="card shadow-sm">
                        <div class="card-body p-4">
                            <h3 class="text-center mb-4">SRMS By Ahmad Login</h3>
                            
                            {% if query_result is  not none %}
                            <div class="alert alert-info">Students in database: {{query_result}}</div>
                            {% endif %}

                            <form method="POST" action="{{ url_for('login') }}">
                                <div class="mb-3">
                                    <label class="form-label">Username</label>
                                    <input type="text" name="username" class="form-control" placeholder="Entery Your Username">
                                </div>
                                <div class="mb-3">    
                                    <label class="form-label">Username</label>
                                    <input type="password" class="form-control" placeholder="Enter Password">
                                </div>
                                <button typer="Submit" class="btn btn-primary w-100">Log In</button>
                                <!-- <a href="{{ url_for('home') }}" class="btn btn-primary w-100">Log In</a> -->                          
                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>
        <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    </body>
</html>
